<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymProgress</title>
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007AFF/FFFFFF?text=Gym">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --accent-color: #30D158; /* Verde fitness */
            --text-color: #FFFFFF;
            --text-secondary: #8E8E93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 60px;
        }

        h1, h2 {
            font-weight: 700;
            margin-bottom: 5px;
        }

        h1 { color: var(--accent-color); }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
            background-color: #2C2C2E;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: 2px solid var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 0;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2C2C2E;
        }

        .exercise-item:last-child {
            border-bottom: none;
        }

        .exercise-info {
            display: flex;
            flex-direction: column;
        }

        .exercise-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-btn {
            background-color: #FF453A;
            color: white;
            width: auto;
            padding: 6px 10px;
            font-size: 12px;
            margin: 0;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>GymProgress 💪</h1>
    <p style="color: var(--text-secondary); margin-top: 0;">Tu progreso semanal</p>

    <div class="card">
        <h2>Registrar Serie</h2>
        <label for="exerciseName">Ejercicio</label>
        <input type="text" id="exerciseName" placeholder="Ej: Press de Banca, Sentadillas" required>
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="weight">Peso (kg)</label>
                <input type="number" id="weight" placeholder="50" step="any" required>
            </div>
            <div style="flex: 1;">
                <label for="reps">Reticiones</label>
                <input type="number" id="reps" placeholder="10" required>
            </div>
        </div>
        
        <button onclick="addWorkout()">Guardar Registro</button>
    </div>

    <div class="card">
        <h2>Evolución (Carga Máxima)</h2>
        <label for="filterExercise">Seleccionar Ejercicio</label>
        <select id="filterExercise" onchange="updateChart()">
            <option value="">-- Registra algo primero --</option>
        </select>
        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2>Historial Reciente</h2>
        <div id="workoutList">
            <p style="color: var(--text-secondary);">No hay entrenamientos registrados aún.</p>
        </div>
    </div>

    <script>
        // Cargar datos iniciales de localStorage
        let workouts = JSON.parse(localStorage.getItem('gymWorkouts')) || [];
        let myChart = null;

        // Guardar y actualizar interfaz al arrancar
        window.onload = function() {
            updateWorkoutList();
            updateDropdown();
            initChart();
        };

        function addWorkout() {
            const name = document.getElementById('exerciseName').value.trim();
            const weight = parseFloat(document.getElementById('weight').value);
            const reps = parseInt(document.getElementById('reps').value);
            const date = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

            if (!name || isNaN(weight) || isNaN(reps)) {
                alert('Por favor, rellena todos los campos correctamente.');
                return;
            }

            const newRecord = { id: Date.now(), name, weight, reps, date };
            workouts.push(newRecord);
            localStorage.setItem('gymWorkouts', JSON.stringify(workouts));

            // Resetear inputs de peso y reps (dejamos el nombre por si hace otra serie)
            document.getElementById('weight').value = '';
            document.getElementById('reps').value = '';

            updateWorkoutList();
            updateDropdown();
            updateChart();
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
            updateWorkoutList();
            updateDropdown();
            updateChart();
        }

        function updateWorkoutList() {
            const listContainer = document.getElementById('workoutList');
            if (workouts.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-secondary);">No hay entrenamientos registrados.</p>';
                return;
            }

            // Mostrar los últimos 5 registros primero
            const recent = [...workouts].reverse().slice(0, 5);
            listContainer.innerHTML = recent.map(w => `
                <div class="exercise-item">
                    <div class="exercise-info">
                        <strong>${w.name}</strong>
                        <span class="exercise-date">${w.date} - ${w.weight} kg x ${w.reps} reps</span>
                    </div>
                    <button class="delete-btn" onclick="deleteWorkout(${w.id})">X</button>
                </div>
            `).join('');
        }

        function updateDropdown() {
            const dropdown = document.getElementById('filterExercise');
            const uniqueExercises = [...new Set(workouts.map(w => w.name))];
            
            const currentSelection = dropdown.value;

            if (uniqueExercises.length === 0) {
                dropdown.innerHTML = '<option value="">-- Registra algo primero --</option>';
                return;
            }

            dropdown.innerHTML = uniqueExercises.map(e => `<option value="${e}">${e}</option>`).join('');
            
            if (uniqueExercises.includes(currentSelection)) {
                dropdown.value = currentSelection;
            }
        }

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Peso Máximo (kg)', data: [], borderColor: '#30D158', tension: 0.2, fill: false }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#2C2C2E' }, ticks: { color: '#8E8E93' } },
                        y: { grid: { color: '#2C2C2E' }, ticks: { color: '#8E8E93' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            updateChart();
        }

        function updateChart() {
            if (!myChart) return;
            
            const selectedExercise = document.getElementById('filterExercise').value;
            if (!selectedExercise) {
                myChart.data.labels = [];
                myChart.data.datasets[0].data = [];
                myChart.update();
                return;
            }

            // Filtrar entrenamientos del ejercicio seleccionado
            const filtered = workouts.filter(w => w.name === selectedExercise);

            // Agrupar por fecha quedándonos con el peso máximo de ese día
            const dataByDate = {};
            filtered.forEach(w => {
                if (!dataByDate[w.date] || dataByDate[w.date] < w.weight) {
                    dataByDate[w.date] = w.weight;
                }
            });

            myChart.data.labels = Object.keys(dataByDate);
            myChart.data.datasets[0].data = Object.values(dataByDate);
            myChart.update();
        }
    </script>
</body>
</html>
